[package]
name = "buturecad-cli"
description = "ButureCAD command-line interface: the same Rust core, no GUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "buturecad"
path = "src/main.rs"

[lib]
name = "buturecad_cli"
path = "src/lib.rs"

[dependencies]
buturecad-geometry = { path = "../../crates/geometry" }
buturecad-eda-core = { path = "../../crates/eda-core" }
buturecad-io = { path = "../../crates/io" }
buturecad-schematic = { path = "../../crates/schematic" }
buturecad-pcb = { path = "../../crates/pcb" }
buturecad-rules = { path = "../../crates/rules" }
buturecad-manufacturing = { path = "../../crates/manufacturing" }
buturecad-scripting = { path = "../../crates/scripting" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
