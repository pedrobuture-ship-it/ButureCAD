[package]
name = "buturecad-desktop"
description = "ButureCAD desktop shell (Tauri 2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lib]
name = "buturecad_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
buturecad-eda-core = { path = "../../../crates/eda-core" }
buturecad-geometry = { path = "../../../crates/geometry" }
buturecad-io = { path = "../../../crates/io" }
buturecad-libraries = { path = "../../../crates/libraries" }
buturecad-pcb = { path = "../../../crates/pcb" }
buturecad-renderer = { path = "../../../crates/renderer" }
buturecad-rules = { path = "../../../crates/rules" }
buturecad-schematic = { path = "../../../crates/schematic" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
ts-rs = "12"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
