[package]
name = "buturecad-plugin-runtime"
description = "Sandboxed plugin runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
buturecad-io = { path = "../io" }
wasmi = { version = "2.0.0", default-features = false, features = ["stable", "std", "validate", "portable-dispatch"] }

[dev-dependencies]
buturecad-testkit = { path = "../testkit" }
tempfile = "3"
wat = "1.262.0"
