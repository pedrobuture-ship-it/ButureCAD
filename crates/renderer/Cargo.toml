[package]
name = "buturecad-renderer"
description = "2D renderer for schematic and PCB views: view/grid/snap/picking, tessellation and a wgpu backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
buturecad-geometry = { path = "../geometry" }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
thiserror = "2"
wgpu = "30"

[dev-dependencies]
proptest = "1"
